[mcp_servers.notion]
url = "http://localhost:9090/notion/mcp"

# Direct: mcp-proxy cannot decode Distill's token response yet.
[mcp_servers.distill]
url = "https://app.distill.review/mcp"

[mcp_servers.sidequest]
url = "https://sdqst.app/mcp"

[mcp_servers.paper]
url = "http://127.0.0.1:29979/mcp"

[mcp_servers.polar]
url = "https://mcp.polar.sh/mcp/polar-mcp"

[mcp_servers.polar-sandbox]
url = "https://mcp.polar.sh/mcp/polar-sandbox"

[mcp_servers.agentation]
command = "npx"
args = ["-y", "agentation-mcp", "server"]

[mcp_servers.sentry]
