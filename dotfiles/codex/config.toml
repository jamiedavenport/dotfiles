[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "EMDASH_HOOK_CONFIG_VERSION=1; if [ -z \"${EMDASH_HOOK_PORT:-}\" ] || [ -z \"${EMDASH_HOOK_NONCE:-}\" ] || [ -z \"${EMDASH_PTY_ID:-}\" ]; then exit 0; fi; curl -sf -X POST -H \"Content-Type: application/json\" -H \"X-Emdash-Token: $EMDASH_HOOK_NONCE\" -H \"X-Emdash-Pty-Id: $EMDASH_PTY_ID\" -H \"X-Emdash-Event-Type: notification\" --data-binary '{\"notification_type\":\"idle_prompt\"}' \"http://127.0.0.1:$EMDASH_HOOK_PORT/hook\" || true"

[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
type = "command"
command = "EMDASH_HOOK_CONFIG_VERSION=1; if [ -z \"${EMDASH_HOOK_PORT:-}\" ] || [ -z \"${EMDASH_HOOK_NONCE:-}\" ] || [ -z \"${EMDASH_PTY_ID:-}\" ]; then exit 0; fi; curl -sf -X POST -H \"Content-Type: application/json\" -H \"X-Emdash-Token: $EMDASH_HOOK_NONCE\" -H \"X-Emdash-Pty-Id: $EMDASH_PTY_ID\" -H \"X-Emdash-Event-Type: notification\" --data-binary '{\"notification_type\":\"permission_prompt\"}' \"http://127.0.0.1:$EMDASH_HOOK_PORT/hook\" || true"

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "INPUT=\"${1:-$(cat)}\"; printf '%s' \"$INPUT\" | { EMDASH_HOOK_CONFIG_VERSION=1; if [ -z \"${EMDASH_HOOK_PORT:-}\" ] || [ -z \"${EMDASH_HOOK_NONCE:-}\" ] || [ -z \"${EMDASH_PTY_ID:-}\" ]; then exit 0; fi; curl -sf -X POST -H \"Content-Type: application/json\" -H \"X-Emdash-Token: $EMDASH_HOOK_NONCE\" -H \"X-Emdash-Pty-Id: $EMDASH_PTY_ID\" -H \"X-Emdash-Event-Type: session-start\" -d @- \"http://127.0.0.1:$EMDASH_HOOK_PORT/hook\" || true; }"

