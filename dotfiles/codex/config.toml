model = "gpt-6-astra"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "danger-full-access"
check_for_update_on_startup = false
personality = "pragmatic"
web_search = "live"
service_tier = "fast"

[shell_environment_policy]
ignore_default_excludes = false

# Served by the local mcp-proxy gateway (dotfiles/mcp-proxy), which holds the OAuth tokens.
[mcp_servers.arxivv]
url = "http://localhost:9090/arxivv/mcp"

[mcp_servers.axiom]
