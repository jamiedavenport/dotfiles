[settings]
lockfile = true

# ---------------------------------------------------------------------------
# Versioned developer CLI tools
# ---------------------------------------------------------------------------

[tools]
github-cli = "latest"
codex = "latest"

ripgrep = "latest"
fd = "latest"
fzf = "latest"
zoxide = "latest"

bat = "latest"
eza = "latest"
delta = "latest"
jq = "latest"

starship = "latest"
shellcheck = "latest"
shfmt = "latest"

# ---------------------------------------------------------------------------
# Native macOS packages
#
# mise's built-in brew implementations download Homebrew package metadata
# directly. Installing Homebrew itself is not required.
# ---------------------------------------------------------------------------

[bootstrap.packages]
"brew:dockutil" = { os = "macos" }
"brew:zsh-autosuggestions" = { os = "macos" }
"brew:zsh-syntax-highlighting" = { os = "macos" }

"brew-cask:ghostty" = { os = "macos" }
"brew-cask:cursor" = { os = "macos" }
"brew-cask:cursor-cli" = { os = "macos" }
"brew-cask:1password" = { os = "macos" }
"brew-cask:chatgpt" = { os = "macos" }
"brew-cask:raycast" = { os = "macos/arm64" }
"brew-cask:thebrowsercompany-dia" = { os = "macos/arm64" }
"brew-cask:whatsapp" = { os = "macos" }
"brew-cask:tidal" = { os = "macos" }
"brew-cask:block-buzz" = { os = "macos" }

# One shared font makes Cursor, its integrated terminal, and Ghostty consistent.
"brew-cask:font-jetbrains-mono-nerd-font" = { os = "macos" }

# ---------------------------------------------------------------------------
# Common repositories
# ---------------------------------------------------------------------------

[bootstrap.repos]
"~/policystack" = { url = "git@github.com:jamiedavenport/policystack.git" }
"~/sidequest" = { url = "git@github.com:jamiedavenport/sidequest.git" }

# ---------------------------------------------------------------------------
# Dotfiles
# ---------------------------------------------------------------------------

[dotfiles]
"~/.zprofile" = { source = "dotfiles/zsh/zprofile", mode = "symlink" }
"~/.zshrc" = { source = "dotfiles/zsh/zshrc", mode = "symlink" }

"~/.gitconfig" = { source = "dotfiles/git/gitconfig", mode = "symlink" }
"~/.ssh/config" = { source = "dotfiles/ssh/config", mode = "symlink" }

"~/.config/starship.toml" = { source = "dotfiles/starship/starship.toml", mode = "symlink" }
"~/.config/ghostty/config.ghostty" = { source = "dotfiles/ghostty/config.ghostty", mode = "symlink" }

# Cursor GUI files are copied rather than symlinked because GUI editors may
# replace settings files atomically. mise can capture their later changes.
"~/Library/Application Support/Cursor/User/settings.json" = { source = "dotfiles/cursor/settings.json", mode = "copy" }
"~/Library/Application Support/Cursor/User/keybindings.json" = { source = "dotfiles/cursor/keybindings.json", mode = "copy" }

# Cursor Agent CLI config can also change when preferences are toggled.
"~/.cursor/cli-config.json" = { source = "dotfiles/cursor/cli-config.json", mode = "copy" }

"~/.codex/config.toml" = { source = "dotfiles/codex/config.toml", mode = "symlink" }
"~/.codex/AGENTS.md" = { source = "dotfiles/codex/AGENTS.md", mode = "symlink" }

# ---------------------------------------------------------------------------
# Bootstrap tasks
# ---------------------------------------------------------------------------

[tasks.bootstrap]
description = "Configure the developer workstation"
run = '''
if [ "$(uname -s)" = "Darwin" ]; then
  cursor_cli="/Applications/Cursor.app/Contents/Resources/app/bin/cursor"
  config_dir="$PWD"

  if [ ! -f "$config_dir/dotfiles/cursor/extensions.txt" ]; then
    config_dir="$HOME/.config/mise"
  fi

  if [ ! -x "$cursor_cli" ]; then
    echo "Cursor CLI not found: $cursor_cli" >&2
    exit 1
  fi

  installed_extension_ids=$("$cursor_cli" --list-extensions)
  installed_extension_versions=$("$cursor_cli" --list-extensions --show-versions)
  cursor_extension_tmp_dir=$(mktemp -d)
  trap 'rm -rf "$cursor_extension_tmp_dir"' EXIT HUP INT TERM

  awk '!/^[[:space:]]*(#|$)/' "$config_dir/dotfiles/cursor/extensions.txt" |
    while IFS= read -r extension; do
      case "$extension" in
        *@*) installed_extensions="$installed_extension_versions" ;;
        *) installed_extensions="$installed_extension_ids" ;;
      esac

      if printf '%s\n' "$installed_extensions" | grep -Fqix -- "$extension"; then
        continue
      fi

      if extension_install_output=$("$cursor_cli" --install-extension "$extension" 2>&1); then
        printf '%s\n' "$extension_install_output"
        continue
      fi

      extension_id=${extension%@*}
      extension_version=${extension#*@}
      extension_publisher=${extension_id%%.*}
      extension_name=${extension_id#*.}

      if [ "$extension_id" = "$extension_name" ]; then
        printf '%s\n' "$extension_install_output" >&2
        echo "Invalid Cursor extension ID: $extension" >&2
        exit 1
      fi

      open_vsx_metadata_url="https://open-vsx.org/api/$extension_publisher/$extension_name"
      if [ "$extension" = "$extension_version" ]; then
        open_vsx_metadata_url="$open_vsx_metadata_url/latest"
      else
        open_vsx_metadata_url="$open_vsx_metadata_url/$extension_version"
      fi

      echo "Cursor marketplace unavailable; installing $extension from Open VSX."
      open_vsx_download_url=$(curl -fsSL "$open_vsx_metadata_url" |
        jq -er '.files.download | select(type == "string" and length > 0)') || {
        printf '%s\n' "$extension_install_output" >&2
        echo "Could not resolve $extension from Open VSX." >&2
        exit 1
      }
      extension_vsix="$cursor_extension_tmp_dir/$extension_id.vsix"
      curl -fsSL "$open_vsx_download_url" -o "$extension_vsix"
      "$cursor_cli" --install-extension "$extension_vsix"
    done

  "$config_dir/scripts/configure-dock"
fi
'''

[tasks.check]
description = "Validate the configuration without changing the workstation"
run = '''
cd "$HOME/.config/mise"

shellcheck bootstrap.sh scripts/configure-dock
shfmt -d bootstrap.sh scripts/configure-dock
bash -n bin/mise

config_file=$(mise config ls | awk '$1 ~ /config\.toml$/ { print $1; exit }')
if [ -z "$config_file" ]; then
  echo "mise did not load config.toml" >&2
  exit 1
fi

mise bootstrap plan
mise bootstrap dotfiles diff
'''

# ---------------------------------------------------------------------------
# macOS preferences
# ---------------------------------------------------------------------------

[bootstrap.macos.dock]
autohide = true
magnification = false
orientation = "bottom"
show_recents = false
tilesize = 48

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true
