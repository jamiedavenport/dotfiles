[settings]
lockfile = true

# ---------------------------------------------------------------------------
# Versioned developer CLI tools
# ---------------------------------------------------------------------------

[tools]
github-cli = "latest"
claude = "latest"
uv = "latest"
"pipx:htomd" = { version = "0.1.0", uvx_args = "--python 3.14" }

# Additional developer tools.
node = "24.20.0"
fnox = "1.35.1"
"aqua:1password/cli" = "2.39.0"

ripgrep = "latest"
fd = "latest"
fzf = "latest"
zoxide = "latest"

bat = "latest"
eza = "latest"
delta = "latest"
jq = "latest"

starship = "latest"
neovim = "latest"
shellcheck = "latest"
shfmt = "latest"

# Installs the Xcode version pinned by scripts/install-xcode.
xcodes = "latest"

# ---------------------------------------------------------------------------
# Native macOS packages
#
# mise's built-in brew implementations download Homebrew package metadata
# directly. Installing Homebrew itself is not required.
# ---------------------------------------------------------------------------

[bootstrap.packages]
"brew:cloudflared" = { os = "macos" }
"brew:dockutil" = { os = "macos" }
"brew:zsh-autosuggestions" = { os = "macos" }
"brew:zsh-syntax-highlighting" = { os = "macos" }

# Tauri iOS tooling: `tauri ios init` probes for `pod` and `idevicesyslog`.
"brew:cocoapods" = { os = "macos" }
"brew:libimobiledevice" = { os = "macos" }

"brew-cask:ghostty" = { os = "macos" }
"brew-cask:cursor" = { os = "macos" }
"brew-cask:tldraw" = { os = "macos" }
"brew-cask:1password" = { os = "macos" }
"brew-cask:paper-design" = { os = "macos/arm64" }
"brew-cask:raycast" = { os = "macos/arm64" }
"brew-cask:thebrowsercompany-dia" = { os = "macos/arm64" }
"brew-cask:notion-calendar" = { os = "macos" }
"brew-cask:notion" = { os = "macos" }
"brew-cask:linear" = { os = "macos" }
"brew-cask:granola" = { os = "macos" }
"brew-cask:slack" = { os = "macos" }
"brew-cask:whatsapp" = { os = "macos" }
"brew-cask:tidal" = { os = "macos" }
"brew-cask:block-buzz" = { os = "macos" }
"brew-cask:nordvpn" = { os = "macos" }

# One shared font makes Cursor, its integrated terminal, and Ghostty consistent.
"brew-cask:font-jetbrains-mono-nerd-font" = { os = "macos" }

# ---------------------------------------------------------------------------
# Common repositories
# ---------------------------------------------------------------------------

[bootstrap.repos]
"~/arxivv.org" = { url = "git@github.com:jamiedavenport/arxivv.org.git" }
"~/auvia" = { url = "git@github.com:Auvia-io/auvia.git" }
"~/capd" = { url = "git@github.com:jamiedavenport/capd.git" }
"~/jamiedavenport" = { url = "git@github.com:jamiedavenport/jamiedavenport.git" }
"~/jxd.dev" = { url = "git@github.com:jamiedavenport/jxd.dev.git" }
"~/muesli" = { url = "git@github.com:jamiedavenport/muesli.git" }
"~/policystack" = { url = "git@github.com:jamiedavenport/policystack.git" }
"~/sidequest" = { url = "git@github.com:jamiedavenport/sidequest.git" }

# ---------------------------------------------------------------------------
# Dotfiles
# ---------------------------------------------------------------------------

[dotfiles]
"~/.zprofile" = { source = "dotfiles/zsh/zprofile", mode = "symlink" }
"~/.zshrc" = { source = "dotfiles/zsh/zshrc", mode = "symlink" }

"~/.gitconfig" = { source = "dotfiles/git/gitconfig", mode = "symlink" }
"~/.ssh/config" = { source = "dotfiles/ssh/config", mode = "symlink" }

"~/.config/starship.toml" = { source = "dotfiles/starship/starship.toml", mode = "symlink" }
"~/.config/ghostty/config.ghostty" = { source = "dotfiles/ghostty/config.ghostty", mode = "symlink" }
# The whole directory is linked so vim.pack's lockfile is versioned with the config.
"~/.config/nvim" = { source = "dotfiles/nvim", mode = "symlink" }

# Cursor GUI files are copied rather than symlinked because GUI editors may
# replace settings files atomically. mise can capture their later changes.
"~/Library/Application Support/Cursor/User/settings.json" = { source = "dotfiles/cursor/settings.json", mode = "copy" }
"~/Library/Application Support/Cursor/User/keybindings.json" = { source = "dotfiles/cursor/keybindings.json", mode = "copy" }

# Claude Code user configuration.
"~/.claude/CLAUDE.md" = { source = "dotfiles/claude/CLAUDE.md", mode = "symlink" }
# Claude Code rewrites settings.json from /config, so copy it and capture changes.
"~/.claude/settings.json" = { source = "dotfiles/claude/settings.json", mode = "copy" }
# Directories are symlinked so agents, rules, and skills created in Claude Code
# land in this repo. App-installed and synced entries are ignored by Git.
"~/.claude/agents" = { source = "dotfiles/claude/agents", mode = "symlink" }
"~/.claude/rules" = { source = "dotfiles/claude/rules", mode = "symlink" }
"~/.claude/skills" = { source = "dotfiles/claude/skills", mode = "symlink" }

# ---------------------------------------------------------------------------
# Bootstrap tasks
# ---------------------------------------------------------------------------

[tasks."dns:cloudflare"]
description = "Use Cloudflare DNS on Wi-Fi"
run = 'networksetup -setdnsservers "Wi-Fi" 1.1.1.1 1.0.0.1'

[tasks.profile-photo]
description = "Set the macOS account photo (or preview with --dry-run)"
run = '''
config_dir="$PWD"
if [ ! -f "$config_dir/scripts/configure-profile-photo.swift" ]; then
  config_dir="$HOME/.config/mise"
fi
/usr/bin/swift "$config_dir/scripts/configure-profile-photo.swift"
'''

# Cap's cask uses an extensionless tar.gz that mise cannot extract reliably.
[tasks.install-cap]
description = "Install Cap from its official macOS DMG (or preview with --dry-run)"
run = '''
config_dir="$PWD"
if [ ! -x "$config_dir/scripts/install-cap" ]; then
  config_dir="$HOME/.config/mise"
fi
"$config_dir/scripts/install-cap"
'''

# capd builds need full Xcode; the Command Line Tools are not enough.
[tasks.install-xcode]
description = "Install and select the Xcode version capd builds with (or preview with --dry-run)"
run = '''
config_dir="$PWD"
if [ ! -x "$config_dir/scripts/install-xcode" ]; then
  config_dir="$HOME/.config/mise"
fi
"$config_dir/scripts/install-xcode"
'''

# capd installs from its unreleased origin/main rather than a release.
[tasks.install-capd]
description = "Build and install capd from origin/main (or preview with --dry-run)"
run = '''
config_dir="$PWD"
if [ ! -x "$config_dir/scripts/install-capd" ]; then
  config_dir="$HOME/.config/mise"
fi
"$config_dir/scripts/install-capd"
'''

# Claude Code keeps MCP servers in ~/.claude.json with runtime state, so the
# server list is applied through the claude CLI instead of as a dotfile.
[tasks."claude:mcp"]
description = "Register Claude Code MCP servers (or preview with --dry-run)"
run = '''
config_dir="$PWD"
if [ ! -x "$config_dir/scripts/configure-claude-mcp" ]; then
  config_dir="$HOME/.config/mise"
fi
"$config_dir/scripts/configure-claude-mcp"
'''

[tasks.bootstrap]
description = "Configure the developer workstation"
run = '''
if [ "$(uname -s)" = "Darwin" ]; then
  cursor_cli="/Applications/Cursor.app/Contents/Resources/app/bin/cursor"
  config_dir="$PWD"

  if [ ! -f "$config_dir/dotfiles/cursor/extensions.txt" ]; then
    config_dir="$HOME/.config/mise"
  fi

  if [ ! -x "$cursor_cli" ]; then
    echo "Cursor CLI not found: $cursor_cli" >&2
    exit 1
  fi

  installed_extension_ids=$("$cursor_cli" --list-extensions)
  installed_extension_versions=$("$cursor_cli" --list-extensions --show-versions)
  cursor_extension_tmp_dir=$(mktemp -d)
  trap 'rm -rf "$cursor_extension_tmp_dir"' EXIT HUP INT TERM

  awk '!/^[[:space:]]*(#|$)/' "$config_dir/dotfiles/cursor/extensions.txt" |
    while IFS= read -r extension; do
      case "$extension" in
        *@*) installed_extensions="$installed_extension_versions" ;;
        *) installed_extensions="$installed_extension_ids" ;;
      esac

      if printf '%s\n' "$installed_extensions" | grep -Fqix -- "$extension"; then
        continue
      fi

      if extension_install_output=$("$cursor_cli" --install-extension "$extension" 2>&1); then
        printf '%s\n' "$extension_install_output"
        continue
      fi

      extension_id=${extension%@*}
      extension_version=${extension#*@}
      extension_publisher=${extension_id%%.*}
      extension_name=${extension_id#*.}

      if [ "$extension_id" = "$extension_name" ]; then
        printf '%s\n' "$extension_install_output" >&2
        echo "Invalid Cursor extension ID: $extension" >&2
        exit 1
      fi

      open_vsx_metadata_url="https://open-vsx.org/api/$extension_publisher/$extension_name"
      if [ "$extension" = "$extension_version" ]; then
        open_vsx_metadata_url="$open_vsx_metadata_url/latest"
      else
        open_vsx_metadata_url="$open_vsx_metadata_url/$extension_version"
      fi

      echo "Cursor marketplace unavailable; installing $extension from Open VSX."
      open_vsx_download_url=$(curl -fsSL "$open_vsx_metadata_url" |
        jq -er '.files.download | select(type == "string" and length > 0)') || {
        printf '%s\n' "$extension_install_output" >&2
        echo "Could not resolve $extension from Open VSX." >&2
        exit 1
      }
      extension_vsix="$cursor_extension_tmp_dir/$extension_id.vsix"
      curl -fsSL "$open_vsx_download_url" -o "$extension_vsix"
      "$cursor_cli" --install-extension "$extension_vsix"
    done

  "$config_dir/scripts/install-cap"
  "$config_dir/scripts/configure-claude-mcp"
  "$config_dir/scripts/configure-dock"
  /usr/bin/swift "$config_dir/scripts/configure-profile-photo.swift"
fi
'''

[tasks.check]
description = "Validate the configuration without changing the workstation"
run = '''
cd "$HOME/.config/mise"

shellcheck bootstrap.sh scripts/configure-claude-mcp scripts/configure-dock scripts/install-cap scripts/install-capd scripts/install-xcode
shfmt -d bootstrap.sh scripts/configure-claude-mcp scripts/configure-dock scripts/install-cap scripts/install-capd scripts/install-xcode
bash -n bin/mise
nvim --headless --clean -u dotfiles/nvim/init.lua +qa
/usr/bin/swiftc -typecheck scripts/configure-profile-photo.swift
xcrun swift-format lint --strict scripts/configure-profile-photo.swift
node scripts/check-private-skills.mjs

config_file=$(mise config ls | awk '$1 ~ /config\.toml$/ { print $1; exit }')
if [ -z "$config_file" ]; then
  echo "mise did not load config.toml" >&2
  exit 1
fi

mise bootstrap plan
mise bootstrap dotfiles diff
./scripts/install-cap --dry-run
./scripts/configure-claude-mcp --dry-run
./scripts/install-capd --dry-run
./scripts/install-xcode --dry-run
/usr/bin/swift "$PWD/scripts/configure-profile-photo.swift" --dry-run
'''

# ---------------------------------------------------------------------------
# macOS preferences
# ---------------------------------------------------------------------------

[bootstrap.macos.dock]
autohide = true
magnification = false
orientation = "bottom"
show_recents = false
tilesize = 32

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true
